server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:health,prometheus}
  metrics:
    tags:
      application: seed-plus-backend

spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # 운영 환경에서 clean 허용은 위험하므로 테스트에서만 FLYWAY_CLEAN_DISABLED=false
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

app:
  base-url: ${SERVER_BASE_URL}

external:
  rest-client:
    connect-timeout-millis: ${EXTERNAL_REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-millis: ${EXTERNAL_REST_CLIENT_READ_TIMEOUT_MS:5000}

analysis:
  lambda:
    profit:
      endpoint: ${PROFIT_FUNCTION_ENDPOINT}
      api-key: ${PROFIT_FUNCTION_API_KEY}
    survival:
      endpoint: ${SURVIVAL_FUNCTION_ENDPOINT}
      api-key: ${SURVIVAL_FUNCTION_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expire-time: ${JWT_ACCESS_EXPIRE_MS:86400000}
  refresh-token:
    expire-time: ${JWT_REFRESH_EXPIRE_MS:259200000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: ${CORS_ALLOWED_METHODS}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    seed.seedplusbackend: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

seoul:
  realtime-city:
    open-api:
      key: ${SEOUL_OPEN_API_KEY}
      base-url: http://openapi.seoul.go.kr:8088
      service-name: citydata_ppltn
      type: xml
      start-index: 1
      end-index: 5
      initial-backoff-millis: ${SEOUL_REALTIME_CITY_INITIAL_BACKOFF_MS:500}
      min-jitter-millis: ${SEOUL_REALTIME_CITY_MIN_JITTER_MS:300}
      max-jitter-millis: ${SEOUL_REALTIME_CITY_MAX_JITTER_MS:1200}
      max-retry-count: ${SEOUL_REALTIME_CITY_MAX_RETRY_COUNT:3}
  sdot:
    open-api:
      key: ${SEOUL_OPEN_API_KEY}
      base-url: http://openapi.seoul.go.kr:8088
      service-name: IotVdata018
      type: json
      page-size: 1000
      min-jitter-millis: ${SEOUL_SDOT_MIN_JITTER_MS:300}
      max-jitter-millis: ${SEOUL_SDOT_MAX_JITTER_MS:1200}
      max-retry-count: ${SEOUL_SDOT_MAX_RETRY_COUNT:3}
  commercial:
    open-api:
      key: ${SEOUL_OPEN_API_KEY}
      base-url: http://openapi.seoul.go.kr:8088
      service-name: VwsmTrdarSelngQq
      type: json
      page-size: 1000
      min-jitter-millis: 300
      max-jitter-millis: 1200
      max-retry-count: 3

# 원천 공표 주기와 수집 확인 주기는 다르다. 실제 스케줄러 연결 전 정책 초안.
# 임대료 CSV는 수동 적재를 유지한다. Spring Batch 작업을 부팅 시 자동 실행하지 않는다.
public-data:
  collection:
    zone: Asia/Seoul
    crons:
      SEOUL_SDOT_FOOT_TRAFFIC: "${COLLECT_SDOT_CRON:0 0 * * * *}"
      SEOUL_REALTIME_CITY_POPULATION: "${COLLECT_CITY_POPULATION_CRON:0 10 * * * *}"
      SEOUL_ESTIMATED_SALES: "${COLLECT_SALES_CRON:0 0 3 * * *}"
      SMALL_BUSINESS_STORE: "${COLLECT_STORES_CRON:0 0 4 * * SUN}"
      KOSIS_BUSINESS_COUNT: "${COLLECT_KOSIS_COUNT_CRON:0 0 5 * * MON}"
      KOSIS_BUSINESS_SURVIVAL_RATE: "${COLLECT_KOSIS_SURVIVAL_CRON:0 30 5 * * MON}"
    # 명시된 서비스 대상만 수집하며 빈 목록이면 대상 미설정으로 처리한다.
    store-sigungu-codes: ${COLLECT_STORE_SIGUNGU_CODES:}
    city-areas: ${COLLECT_CITY_AREAS:}

small-business:
  store:
    open-api:
      service-key: ${SMALL_BUSINESS_STORE_API_KEY}
      base-url: https://apis.data.go.kr/B553077/api/open/sdsc2
      endpoint: storeListInArea
      type: json
      page-size: 1000
      initial-backoff-millis: ${SMALL_BUSINESS_STORE_INITIAL_BACKOFF_MS:500}
      max-retry-count: ${SMALL_BUSINESS_STORE_MAX_RETRY_COUNT:3}

kosis:
  business-survival:
    open-api:
      key: ${KOSIS_API_KEY}
      base-url: https://kosis.kr
      endpoint: /openapi/Param/statisticsParameterData.do
      organization-id: "101"
      table-id: DT_2BD1003
      connect-timeout-millis: ${KOSIS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-millis: ${KOSIS_READ_TIMEOUT_MS:30000}
      initial-backoff-millis: ${KOSIS_INITIAL_BACKOFF_MS:500}
      min-jitter-millis: ${KOSIS_MIN_JITTER_MS:300}
      max-jitter-millis: ${KOSIS_MAX_JITTER_MS:1200}
      max-retry-count: ${KOSIS_MAX_RETRY_COUNT:3}
  business-count:
    open-api:
      key: ${KOSIS_API_KEY}
      base-url: https://kosis.kr
      endpoint: /openapi/Param/statisticsParameterData.do
      organization-id: "101"
      table-id: DT_1BD1001
      connect-timeout-millis: ${KOSIS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-millis: ${KOSIS_READ_TIMEOUT_MS:30000}
      initial-backoff-millis: ${KOSIS_INITIAL_BACKOFF_MS:500}
      min-jitter-millis: ${KOSIS_MIN_JITTER_MS:300}
      max-jitter-millis: ${KOSIS_MAX_JITTER_MS:1200}
      max-retry-count: ${KOSIS_MAX_RETRY_COUNT:3}
